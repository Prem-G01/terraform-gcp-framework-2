          AND resource.type="gce_instance" AND resource.labels.project_id="prj-dg-cl-apps-dev"
          AND resource.labels.instance_id="6338623595865642414"
        duration: 300s
        severity: WARNING
        notification_channels:
        - callgenie-operations-email
        user_labels:
          application: callgenie
          environment: dev
          managed_by: terraform
        documentation: 'Redis uses allkeys-lru; sustained eviction suggests cache
          pressure or missing TTLs. Delta is since the previous successful sample.


          Runbook: https://github.com/Prem-G01/terraform-gcp-framework-2/blob/main/docs/monitoring-callgenie.md'
        alert_strategy:
          auto_close: 1800s
          renotify_interval: 3600s
          notification_prompts:
          - OPENED
          - CLOSED
        threshold: 0
        comparison: COMPARISON_GT
        aligner: ALIGN_MEAN
        alignment_period: 60s
        trigger_count: 1
        evaluation_missing_data: EVALUATION_MISSING_DATA_INACTIVE
      redis-rejected_connections_delta:
        display_name: Callgenie Dev | Redis rejecting connections
        filter: metric.type="custom.googleapis.com/callgenie/redis/rejected_connections_delta"
          AND resource.type="gce_instance" AND resource.labels.project_id="prj-dg-cl-apps-dev"
          AND resource.labels.instance_id="6338623595865642414"
        duration: 0s
        severity: CRITICAL
        notification_channels:
        - callgenie-operations-email
        user_labels:
          application: callgenie
          environment: dev
          managed_by: terraform
        documentation: 'Check maxclients, connection pools and file descriptor limits.
          Delta is since the previous successful sample.


          Runbook: https://github.com/Prem-G01/terraform-gcp-framework-2/blob/main/docs/monitoring-callgenie.md'
        alert_strategy:
          auto_close: 1800s
          renotify_interval: 3600s
          notification_prompts:
          - OPENED
          - CLOSED
        threshold: 0
        comparison: COMPARISON_GT
        aligner: ALIGN_MEAN
        alignment_period: 60s
        trigger_count: 1
      redis-persistence_ok:
        display_name: Callgenie Dev | Redis persistence reports a failure
        filter: metric.type="custom.googleapis.com/callgenie/redis/persistence_ok"
          AND resource.type="gce_instance" AND resource.labels.project_id="prj-dg-cl-apps-dev"
