        duration: 120s
        severity: CRITICAL
        notification_channels:
        - callgenie-operations-email
        user_labels:
          application: callgenie
          environment: dev
          managed_by: terraform
        documentation: 'Inspect Redis logs, disk space and AOF/RDB persistence status.
          Preserve all data files.


          Runbook: https://github.com/Prem-G01/terraform-gcp-framework-2/blob/main/docs/monitoring-callgenie.md'
        alert_strategy:
          auto_close: 1800s
          renotify_interval: 3600s
          notification_prompts:
          - OPENED
          - CLOSED
        threshold: 1
        comparison: COMPARISON_LT
        aligner: ALIGN_MEAN
        alignment_period: 60s
        trigger_count: 1
        evaluation_missing_data: EVALUATION_MISSING_DATA_INACTIVE
      redis-collector-missing:
        display_name: Callgenie Dev | Redis monitoring heartbeat missing
        filter: metric.type="custom.googleapis.com/callgenie/redis/up" AND resource.type="gce_instance"
