# =============================================================================
# Dependency engine
# -----------------------------------------------------------------------------
# Declares which resource types each resource type requires to be enabled.
# engine/dependency_engine.py walks this graph against a deployment.yaml's
# `resources.*.enabled` map and:
#   - fails if an enabled resource's dependency is disabled or absent
#   - fails on cycles (there shouldn't be any — this is also unit tested)
#   - fails if a resource instance references another instance that does not
#     exist (e.g. subnet.vpc: "typo-vpc")
#
# This mirrors the depends_on graph that used to be hand-wired in the old
# Environment/dev/main.tf — it is now data instead of duplicated HCL.
# =============================================================================

dependencies:
  subnet:
    requires: [vpc]
  firewall:
    requires: [vpc]
  router:
    requires: [vpc]
  nat:
    requires: [router]
  private_service_access:
    requires: [vpc]
  vm:
    requires: [subnet]
  cloudsql:
    requires: [vpc, private_service_access, secrets]
  cloudrun:
    requires: []
  load_balancer:
    requires: [cloudrun]
  scheduler:
    requires: [service_accounts]
  workflows:
    requires: [service_accounts]
  alert_policies:
    requires: [notification_channels]
  gke:
    requires: [vpc, subnet, service_accounts]
  cloudfunctions:
    requires: [service_accounts]
  memorystore:
    requires: [vpc, private_service_access]
  iap:
    requires: [vm]
  workload_identity:
    requires: [gke, service_accounts]

# Resource types with no entry above (apis, kms, secrets, buckets,
# artifact_registry, pubsub, cloudtasks, notification_channels,
# uptime_checks, logging, bigquery, documentai, service_accounts, vpc,
# vpc_service_controls, org_policies, binary_authorization) have no hard
# dependency on another platform resource type. vpc_service_controls,
# org_policies, and binary_authorization are all project-level policy —
# they restrict existing resources rather than needing any of them
# enabled first (binary_authorization's policy applies to GKE only once
# modules/compute/gke's own enable_binary_authorization wiring picks it
# up, but the *policy itself* is valid with zero other resources
# enabled).
