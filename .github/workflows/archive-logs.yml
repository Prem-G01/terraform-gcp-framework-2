# Archive completed Callgenie jobs without executing code from the source run.
name: Archive Callgenie Workflow Logs

on:
  workflow_run:
    workflows: [Callgenie Terraform Plan, Callgenie Terraform Apply]
    types: [completed]

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  archive:
    if: >-
      github.repository == 'Prem-G01/terraform-gcp-framework-2' &&
      github.event.workflow_run.repository.full_name == 'Prem-G01/terraform-gcp-framework-2' &&
      contains(fromJSON('["Callgenie Terraform Plan", "Callgenie Terraform Apply"]'), github.event.workflow_run.name)
    runs-on: ubuntu-latest
    concurrency:
      group: callgenie-logs-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ fromJson(vars.ENVIRONMENTS_JSON).callgenie.wif_provider }}
          service_account: ${{ fromJson(vars.ENVIRONMENTS_JSON).callgenie.tf_plan_sa }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Download completed run console logs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import time
          import zipfile

          repository = os.environ["SOURCE_REPOSITORY"]
          run_id = int(os.environ["SOURCE_RUN_ID"])
          attempt = int(os.environ["SOURCE_RUN_ATTEMPT"])
          endpoint = f"repos/{repository}/actions/runs/{run_id}/attempts/{attempt}/logs"
          archive = Path("github-console-logs.zip")
          # gh follows GitHub's signed download redirect without forwarding the
          # Authorization header to another host. Never print that redirect URL.
          for retry in range(3):
              with archive.open("wb") as output:
                  result = subprocess.run(
                      ["gh", "api", "--method", "GET", endpoint],
                      stdout=output,
                      stderr=subprocess.PIPE,
                      check=False,
                  )
              if result.returncode == 0 and zipfile.is_zipfile(archive):
                  break
              if retry == 2:
                  raise SystemExit("GitHub console log archive was unavailable after three attempts.")
              time.sleep(5)
          print(f"Downloaded console logs for run {run_id}, attempt {attempt}.")
          PY

      - name: Archive console logs
        env:
          ARCHIVE_BUCKET: ${{ fromJson(vars.ENVIRONMENTS_JSON).callgenie.artifact_bucket }}
          ARCHIVE_PREFIX: deployments/callgenie/${{ github.event.workflow_run.id }}/attempts/${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          python scripts/archive_upload.py github-console-logs.zip
