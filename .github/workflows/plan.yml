# Callgenie-only plan workflow for Prem-G01/terraform-gcp-framework-2.
# Saafe production is deliberately excluded from deployment in this repository.
name: Callgenie Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "config/environments/callgenie/**"
      - "environments/callgenie/**"
      - "config/global/**"
      - "config/schema/**"
      - "modules/**"
      - "platform/**"
      - "engine/**"
      - "scripts/startup/**"
      - "scripts/archive_upload.py"
      - "tests/test_archive_upload.py"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Callgenie dev only (prj-dg-cl-apps-dev)"
        required: true
        default: callgenie
        type: choice
        options: [callgenie]

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    if: github.repository == 'Prem-G01/terraform-gcp-framework-2'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [callgenie]
    # A new push to the same PR makes the previous plan stale — cancel it
    # rather than waste a runner computing a plan nobody will read.
    concurrency:
      group: tfplan-${{ matrix.env }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1. Validation — schema, dependency, security, naming, region, cost.
      #    Blocks here on any ERROR-severity finding (see docs/validation.md).
      - name: Validate and render
        run: |
          set -euo pipefail
          pip install -q -r engine/requirements.txt
          python -m engine.ci_prepare "${{ matrix.env }}" 2>&1 | tee validation-console.log

      # 3. Hard-code scan — modules/, platform/, bootstrap/ must stay
      #    environment-agnostic.
      - name: Hard-code scan
        run: python -m engine.cli hardcode-scan .

      # 3b. Secret scan — whole repo, not just modules/.
      - name: Secret scan
        run: python -m engine.cli secret-scan .

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive .

      - id: auth
        if: ${{ always() }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ fromJson(vars.ENVIRONMENTS_JSON)[matrix.env].wif_provider }}
          service_account: ${{ fromJson(vars.ENVIRONMENTS_JSON)[matrix.env].tf_plan_sa }}

      - id: gcloud
        if: ${{ always() && steps.auth.outcome == 'success' }}
        uses: google-github-actions/setup-gcloud@v2

      # 4. terraform init + validate + plan, scoped to this environment.
      - name: terraform plan
        working-directory: environments/${{ matrix.env }}
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=${{ fromJson(vars.ENVIRONMENTS_JSON)[matrix.env].state_bucket }}" \
            -backend-config="prefix=${{ matrix.env }}" 2>&1 | tee -a terraform-console.log
          terraform validate -no-color 2>&1 | tee -a terraform-console.log
          terraform plan -no-color -input=false -var="project_id=prj-dg-cl-apps-dev" -out=tfplan 2>&1 | tee -a terraform-console.log
          terraform show -no-color tfplan > plan.txt 2>> terraform-console.log
          terraform show -json tfplan > plan.json 2>> terraform-console.log

      # 5. Upload plan + validation report — never applied automatically
      #    from this workflow (see apply.yml).
      - name: Upload plan artifacts
        if: ${{ always() && steps.auth.outcome == 'success' && steps.gcloud.outcome == 'success' }}
        env:
          ARCHIVE_BUCKET: ${{ fromJson(vars.ENVIRONMENTS_JSON)[matrix.env].artifact_bucket }}
          STACK_DIR: environments/${{ matrix.env }}
          ARCHIVE_PREFIX: deployments/${{ matrix.env }}/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          files=(validation.json validation-console.log
            "$STACK_DIR/terraform-console.log" "$STACK_DIR/plan.txt"
            "$STACK_DIR/plan.json" "$STACK_DIR/.generated/override-audit.jsonl")
          existing=()
          for file in "${files[@]}"; do
            if [[ -f "$file" ]]; then
              existing+=("$file")
            fi
          done
          if (( ${#existing[@]} )); then
            python scripts/archive_upload.py "${existing[@]}"
          else
            echo "No plan artifacts were produced before this run stopped."
          fi
