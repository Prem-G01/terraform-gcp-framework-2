# =============================================================================
# Plan pipeline — runs on every PR that touches config/environments/<env>,
# shared modules, or the platform root. Read-only: validates, renders, and
# plans. Never applies. Replaces the old cicd/cloudbuild-plan.yaml now that
# GitHub Actions (not Cloud Build) is this platform's CI/CD engine — see
# docs/cicd.md.
#
# Authenticates to GCP via Workload Identity Federation
# (bootstrap/main.tf's google_iam_workload_identity_pool_provider.github) —
# no service-account key ever stored in GitHub. One-time setup, per
# repository:
#   1. terraform apply bootstrap/ with enable_workload_identity_federation
#      = true and github_repository = "<org>/<repo>".
#   2. Create a repository variable ENVIRONMENTS_JSON (Settings > Secrets
#      and variables > Actions > Variables) — see docs/cicd.md for its
#      shape.
# =============================================================================

name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "config/environments/**"
      - "config/global/**"
      - "config/schema/**"
      - "modules/**"
      - "platform/**"
      - "engine/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Single environment to plan (leave blank to auto-detect from changed paths)"
        required: false
        type: choice
        options: ["", dev, sit, uat, prod, saafe]

permissions:
  contents: read
  id-token: write

jobs:
  detect-envs:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.detect.outputs.envs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.environment }}" ]; then
            echo 'envs=["${{ inputs.environment }}"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # workflow_dispatch with no environment chosen has no PR to diff
          # against (github.event.pull_request is only set on pull_request
          # events) — refuse with a clear message instead of crashing on
          # `git diff` against an empty ref.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::Manual run with no environment selected — choose one from the 'environment' input rather than leaving it blank." >&2
            exit 1
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.sha }}"
          changed=$(git diff --name-only "$base" "$head")
          if echo "$changed" | grep -qE '^(modules/|platform/|config/global/|config/schema/|engine/)'; then
            envs='["dev","sit","uat","prod","saafe"]'
          else
            envs=$(echo "$changed" \
              | grep -oE '^config/environments/[a-z]+/' \
              | sed -E 's#config/environments/([a-z]+)/#\1#' \
              | sort -u | jq -R . | jq -sc .)
          fi
          echo "envs=$envs" >> "$GITHUB_OUTPUT"

  plan:
    needs: detect-envs
    if: needs.detect-envs.outputs.envs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.detect-envs.outputs.envs) }}
    # A new push to the same PR makes the previous plan stale — cancel it
    # rather than waste a runner computing a plan nobody will read.
    concurrency:
      group: tfplan-${{ matrix.env }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1. Validation — schema, dependency, security, naming, region, cost.
      #    Blocks here on any ERROR-severity finding (see docs/validation.md).
      - name: Validate
        run: |
          set -euo pipefail
          pip install -q -r engine/requirements.txt
          python -m engine.cli validate "config/environments/${{ matrix.env }}" --json | tee validation.json
          python -c "import json,sys; sys.exit(1 if json.load(open('validation.json'))['blocked'] else 0)"

      # 2. Render — writes the validated, normalized deployment.json.
      - name: Render
        run: |
          python -m engine.cli render "config/environments/${{ matrix.env }}" \
            --out "environments/${{ matrix.env }}/.generated/deployment.normalized.json"

      # 3. Hard-code scan — modules/, platform/, bootstrap/ must stay
      #    environment-agnostic.
      - name: Hard-code scan
        run: python -m engine.cli hardcode-scan .

      # 3b. Secret scan — whole repo, not just modules/.
      - name: Secret scan
        run: python -m engine.cli secret-scan .

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive .

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ fromJson(vars.ENVIRONMENTS_JSON)[matrix.env].wif_provider }}
          service_account: ${{ fromJson(vars.ENVIRONMENTS_JSON)[matrix.env].tf_plan_sa }}

      - uses: google-github-actions/setup-gcloud@v2

      # 4. terraform init + validate + plan, scoped to this environment.
      - name: terraform plan
        working-directory: environments/${{ matrix.env }}
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=${{ fromJson(vars.ENVIRONMENTS_JSON)[matrix.env].state_bucket }}" \
            -backend-config="prefix=${{ matrix.env }}"
          terraform validate
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan > plan.json

      # 5. Upload plan + validation report — never applied automatically
      #    from this workflow (see apply.yml).
      - name: Upload plan artifacts
        run: |
          set -euo pipefail
          bucket="${{ fromJson(vars.ENVIRONMENTS_JSON)[matrix.env].artifact_bucket }}"
          gcloud storage cp validation.json \
            "environments/${{ matrix.env }}/plan.txt" \
            "environments/${{ matrix.env }}/plan.json" \
            "gs://${bucket}/deployments/${{ matrix.env }}/${{ github.run_id }}/"
