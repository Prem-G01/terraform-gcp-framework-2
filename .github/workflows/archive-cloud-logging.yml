# Snapshot project logs under the Callgenie folder in the shared history bucket.
name: Archive Callgenie Cloud Logging

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudlog-callgenie
  cancel-in-progress: false

jobs:
  archive:
    if: github.repository == 'Prem-G01/terraform-gcp-framework-2'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ fromJson(vars.ENVIRONMENTS_JSON).callgenie.wif_provider }}
          service_account: ${{ fromJson(vars.ENVIRONMENTS_JSON).callgenie.tf_plan_sa }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Archive retained Cloud Logging records
        env:
          LOG_SOURCE_PROJECT: prj-dg-cl-apps-dev
          ARCHIVE_BUCKET: ${{ fromJson(vars.ENVIRONMENTS_JSON).callgenie.state_bucket }}
          ARCHIVE_PREFIX: ${{ fromJson(vars.ENVIRONMENTS_JSON).callgenie.logging_prefix }}
          LOG_CHECKPOINT: ${{ format('{0}/cloud-logging-checkpoint.json', fromJson(vars.ENVIRONMENTS_JSON).callgenie.state_prefix) }}
        run: |
          set -euo pipefail
          python scripts/archive_cloud_logging.py
