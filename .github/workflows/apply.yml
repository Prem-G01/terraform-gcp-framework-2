# Callgenie-only apply workflow for Prem-G01/terraform-gcp-framework-2.
# Saafe production is deliberately excluded from deployment in this repository.
name: Callgenie Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "config/environments/callgenie/**"
      - "environments/callgenie/**"
      - "config/global/**"
      - "config/schema/**"
      - "modules/**"
      - "platform/**"
      - "engine/**"
      - "scripts/startup/**"
      - "scripts/archive_upload.py"
      - "tests/test_archive_upload.py"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Callgenie dev only (prj-dg-cl-apps-dev)"
        required: true
        default: callgenie
        type: choice
        options: [callgenie]

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    if: github.repository == 'Prem-G01/terraform-gcp-framework-2'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [callgenie]
    # Configure required reviewers on this repository's callgenie environment.
    environment: ${{ matrix.env }}
    # Serialize applies per environment — never cancel an in-flight apply
    # (that could leave infrastructure half-applied), just queue the next
    # one behind it rather than letting two runs race on the same GCS
    # state lock.
    concurrency:
      group: tfapply-${{ matrix.env }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate and render
        run: |
          set -euo pipefail
          pip install -q -r engine/requirements.txt
          python -m engine.ci_prepare "${{ matrix.env }}" 2>&1 | tee validation-console.log


      - id: auth
        if: ${{ always() }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ fromJson(vars.ENVIRONMENTS_JSON)[matrix.env].wif_provider }}
          service_account: ${{ fromJson(vars.ENVIRONMENTS_JSON)[matrix.env].tf_apply_sa }}

      - id: gcloud
        if: ${{ always() && steps.auth.outcome == 'success' }}
        uses: google-github-actions/setup-gcloud@v2

      # Uploads every cloudfunctions instance's local source to the exact
      # bucket/object its deployment.yaml names, so `apply` deploys the
      # same artifact this step just built — see docs/modules.md "Building
      # and uploading Cloud Function source". A no-op with no
      # cloudfunctions instances configured.
      - name: Build function source
        run: |
          set -euo pipefail
          pip install -q -r engine/requirements.txt
          python -m engine.cli build-function-source "config/environments/${{ matrix.env }}"

      # Secret scan gates apply too, not just plan — a secret introduced
      # between the reviewed plan and this run must still be caught.
      - name: Secret scan
        run: python -m engine.cli secret-scan .

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"

      - name: terraform apply
        working-directory: environments/${{ matrix.env }}
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=${{ fromJson(vars.ENVIRONMENTS_JSON)[matrix.env].state_bucket }}" \
            -backend-config="prefix=${{ matrix.env }}" 2>&1 | tee -a terraform-console.log
          terraform validate -no-color 2>&1 | tee -a terraform-console.log
          terraform plan -no-color -input=false -var="project_id=prj-dg-cl-apps-dev" -out=tfplan 2>&1 | tee -a terraform-console.log
          terraform show -no-color tfplan > plan.txt 2>> terraform-console.log
          terraform show -json tfplan > plan.json 2>> terraform-console.log
          terraform apply -no-color -input=false -auto-approve tfplan 2>&1 | tee -a terraform-console.log
          terraform output -json > apply_outputs.json 2>> terraform-console.log

      - name: Upload apply artifacts
        if: ${{ always() && steps.auth.outcome == 'success' && steps.gcloud.outcome == 'success' }}
        env:
          ARCHIVE_BUCKET: ${{ fromJson(vars.ENVIRONMENTS_JSON)[matrix.env].artifact_bucket }}
          STACK_DIR: environments/${{ matrix.env }}
          ARCHIVE_PREFIX: deployments/${{ matrix.env }}/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          files=(validation.json validation-console.log
            "$STACK_DIR/terraform-console.log" "$STACK_DIR/plan.txt"
            "$STACK_DIR/plan.json" "$STACK_DIR/apply_outputs.json"
            "$STACK_DIR/.generated/override-audit.jsonl")
          existing=()
          for file in "${files[@]}"; do
            if [[ -f "$file" ]]; then
              existing+=("$file")
            fi
          done
          if (( ${#existing[@]} )); then
            python scripts/archive_upload.py "${existing[@]}"
          else
            echo "No apply artifacts were produced before this run stopped."
          fi
